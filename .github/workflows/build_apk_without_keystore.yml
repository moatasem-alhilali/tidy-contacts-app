name: Build & Ship APK (Telegram) • arm64 only (no keystore)

on:
  push:
    branches: [main]
  workflow_dispatch:

# نجعل كل تشغيل فريدًا لكل commit حتى لا يُلغى البناء بسبب دفع لاحق
concurrency:
  group: apk-${{ github.sha }}
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ضبط JVM لجرادل لتقليل أعطال الذاكرة وتوضيح اللوج
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC"
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"
      FLUTTER_VERSION: "3.32.4"

    steps:
      # ============ 0) Checkout ============
      - name: 0) Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============ 1) Toolchain ============
      - name: 1) Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 2) Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 3) Print env & versions
        run: |
          set -Eeuo pipefail
          echo "Github Actor        : $GITHUB_ACTOR"
          echo "Repository          : $GITHUB_REPOSITORY"
          echo "Branch/Ref          : ${GITHUB_REF#refs/*/}"
          echo "Commit              : $GITHUB_SHA"
          echo "Runner              : $RUNNER_OS - $ImageOS"
          echo "Java                : $(java -version 2>&1 | head -n1)"
          echo "Flutter             : $(flutter --version)"
          echo "Dart                : $(dart --version)"
          echo "Gradle (wrapper?)   : $(./android/gradlew -v 2>/dev/null || echo 'no wrapper')"
          echo "Working dir content :"
          ls -la

      # ============ 2) Dependencies ============
      - name: 4) Flutter pub get (with log)
        run: |
          set -Eeuo pipefail
          START=$(date +%s)
          flutter pub get 2>&1 | tee pubget.log
          echo "pub get exit code: ${PIPESTATUS[0]}"
          END=$(date +%s); echo "pub get took $((END-START))s"

      # ============ 3) Build ============
      - name: 5) Build APK (release, arm64 only)
        id: build
        run: |
          set -Eeuo pipefail
          START=$(date +%s)
          echo "🚀 Starting flutter build at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # بناء APK arm64 فقط – اللوج يذهب لملف
          flutter build apk --release --target-platform android-arm64 > build.log 2>&1
          BUILD_CODE=$?

          END=$(date +%s)
          echo "✅ Build finished with code $BUILD_CODE in $((END-START))s"

          if [ "$BUILD_CODE" -ne 0 ]; then
            echo "❌ Flutter build failed – check build.log artifact for details"
            exit "$BUILD_CODE"
          fi

      # ============ 4) Post-build inspect ============
      - name: 6) Inspect artifacts & compute meta
        id: meta
        run: |
          set -Eeuo pipefail
          echo "Listing flutter-apk dir:"
          ls -la build/app/outputs/flutter-apk || true

          FILE=$(ls build/app/outputs/flutter-apk/*-release.apk 2>/dev/null | head -n1 || true)
          if [ -z "$FILE" ]; then
            echo "❌ No release APK produced"
            exit 1
          fi

          # حساب الحجم والـ SHA256
          SIZE_BYTES=$(stat -c%s "$FILE")
          SIZE_HUMAN=$(numfmt --to=iec --suffix=B "$SIZE_BYTES")
          SHA256=$(sha256sum "$FILE" | awk '{print $1}')

          echo "APK file    : $FILE"
          echo "APK size    : $SIZE_HUMAN ($SIZE_BYTES bytes)"
          echo "APK sha256  : $SHA256"

          echo "file=$FILE"        >> $GITHUB_OUTPUT
          echo "size=$SIZE_HUMAN"  >> $GITHUB_OUTPUT
          echo "sha256=$SHA256"    >> $GITHUB_OUTPUT

      # ============ 5) Upload artifacts ============
      - name: 7) Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: ${{ steps.meta.outputs.file }}
          retention-days: 14
          if-no-files-found: error

      - name: 8) Upload logs (build.log + pubget.log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            pubget.log
          retention-days: 30
          if-no-files-found: warn

      # ============ 6) Telegram notifications ============
      - name: 9) Send APK to Telegram (with meta)
        if: success() && !cancelled()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -Eeuo pipefail
          FILE="${{ steps.meta.outputs.file }}"
          SIZE="${{ steps.meta.outputs.size }}"
          SHA256="${{ steps.meta.outputs.sha256 }}"

          CAPTION="✅ $(basename "$FILE") • $GITHUB_REPOSITORY • ${GITHUB_REF#refs/*/}
          Size: $SIZE
          SHA256: $SHA256
          Commit: ${GITHUB_SHA::8}
          Runner: $RUNNER_OS
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # لا نفعّل set -x هنا حتى لا نطبع التوكن
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="$CAPTION" \
            -F document=@"$FILE"

      - name: 10) Telegram Failure (attach last logs)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -Eeuo pipefail
          # قص آخر 1000 سطر للعرض + ارفاق الملف كامل كأرتيفاكت مسبقًا
          tail -n 1000 build.log > build_error_tail.log || echo "No build.log found." > build_error_tail.log

          CAPTION="❌ Build failed: $GITHUB_REPOSITORY @ ${GITHUB_REF#refs/*/} (commit ${GITHUB_SHA::8})
          Conclusion: ${{ job.status }}
          Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F caption="$CAPTION" \
            -F document=@build_error_tail.log

      - name: 11) Why did we stop?
        if: always()
        run: |
          echo "Job conclusion: ${{ job.status }}"
          echo "Cancelled?     ${{ job.status == 'cancelled' }}"
